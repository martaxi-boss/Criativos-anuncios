name: Criativos-anuncios - gerar video automaticamente

on:
  push:
    branches:
      - main
      - consolidar-criativos-anuncios-20261019
    paths:
      - ads/requests/**
  workflow_dispatch:
    inputs:
      request_file:
        description: "Pedido JSON em ads/requests/ (sem alterar o site)"
        required: false
        type: string
        default: "ads/requests/lowcost-europa-cinco-fotos.json"
      source_url:
        description: "URL publica do site a captar automaticamente; se presente nao exige fotos"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    name: Render privado e QA de voz + todas as cenas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preparar motor e bibliotecas
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffprobe >/dev/null
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --no-input -q piper-tts pillow edge-tts
      - name: Escolher pedido
        shell: bash
        env:
          DISPATCH_REQUEST: ${{ inputs.request_file }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_URL" ]; then
            test "${{ github.event_name }}" = "workflow_dispatch"
            REQUEST="ad-output/auto_request.json"
            echo "AUTO_SOURCE=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST="$DISPATCH_REQUEST"
            echo "AUTO_SOURCE=0" >> "$GITHUB_ENV"
          else
            echo "AUTO_SOURCE=0" >> "$GITHUB_ENV"
            REQUEST="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "${{ github.sha }}" | grep '^ads/requests/[a-zA-Z0-9_-]*\.json$' | head -n 1 || true)"
          fi
          if [ "$REQUEST" != "ad-output/auto_request.json" ]; then
            case "$REQUEST" in
              ads/requests/*.json) ;;
              *) echo "Invalid or missing request path" >&2; exit 1 ;;
            esac
            test -f "$REQUEST"
          fi
          echo "REQUEST_FILE=$REQUEST" >> "$GITHUB_ENV"
          echo "INPUT: $REQUEST"
      - name: Identificar site automatico do pedido (link no JSON ou dispatch)
        shell: bash
        env:
          DISPATCH_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          source = os.environ.get('DISPATCH_SOURCE_URL') or ''
          file = os.environ['REQUEST_FILE']
          if not source and file != 'ad-output/auto_request.json':
              with open(file, encoding='utf-8') as handle:
                  data=json.load(handle)
              source = data.get('source_url') or ''
          if source:
              if not isinstance(source, str) or len(source)>2048 or any(x in source for x in '\r\n\t'):
                  raise ValueError('Invalid public source URL')
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
                  env.write('AUTO_SOURCE=1\n')
                  env.write('AUTO_SOURCE_URL='+source+'\n')
          PY
      - name: Capturar imagens reais do site publico sem fotografias manuais
        if: ${{ env.AUTO_SOURCE == '1' }}
        shell: bash
        env:
          SOURCE_URL: ${{ env.AUTO_SOURCE_URL }}
        run: |
          set -euo pipefail
          .venv/bin/pip install --disable-pip-version-check --no-input -q playwright
          .venv/bin/python -m playwright install chromium
          if [ -f "$REQUEST_FILE" ]; then
            .venv/bin/python tools/criativos_anuncios/auto_site.py --url "$SOURCE_URL" \
              --output-dir ad-output --id "site-preview-${{ github.run_id }}" \
              --source-request "$REQUEST_FILE"
          else
            .venv/bin/python tools/criativos_anuncios/auto_site.py --url "$SOURCE_URL" \
              --output-dir ad-output --id "site-preview-${{ github.run_id }}"
          fi
          test -s ad-output/auto_request.json
          test -s ad-output/site_capture.json
          test -s ad-output/work/scene_01.png
      - name: Criar anuncio com imagens reais e voz aprovada
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AUTO_SOURCE:-0}" = "1" ]; then
            .venv/bin/python tools/criativos_anuncios/render.py               --request ad-output/auto_request.json --output-dir ad-output --cached-assets
          else
            .venv/bin/python tools/criativos_anuncios/render.py               --request "$REQUEST_FILE" --output-dir ad-output
          fi
      - name: Mostrar testes da entrega
        shell: bash
        run: |
          set -euo pipefail
          cat ad-output/report.json
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration -of json ad-output/*.mp4
          test -f ad-output/voice_ptpt.wav
          test -f ad-output/preview_scenes.jpg
      - name: Entregar MP4 de teste sem publicacao comercial
        uses: actions/upload-artifact@v4
        with:
          name: criativos-anuncios-mp4-voz-qa
          path: |
            ad-output/*.mp4
            ad-output/voice_ptpt.wav
            ad-output/preview_scenes.jpg
            ad-output/report.json
            ad-output/site_capture.json
            ad-output/auto_request.json
            ad-output/media_candidates.jpg
            ad-output/media_candidates.json
            ad-output/brand_logo.png
            ad-output/raw_candidates/*.png
            ad-output/business_brief.json
            ad-output/storyboard.json
            ad-output/work/scene_*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
